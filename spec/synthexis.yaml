# synthexis specification: single source of truth.
# FigJam diagrams, task lists and tests are derived from this file.
# Status values: planned | probe | building | done | dropped
# Evidence values: measured (cite probe) | doc (cite source) | hypothesis

meta:
  version: 0.1
  updated: 2026-10-29
  track: indie
  theme: build-for-your-world
  deadline: "2026-11-04T21:00:00-05:00"
  target_host: FL Studio 2026 (26.1.6), macOS 27, Apple Silicon (M1 Pro 16 GB dev machine)

# ---------------------------------------------------------------------------
# 1. Feature inventory: every function from Noa's idea blob, one line each.
#    `nodes` points to the spec elements that implement it.
# ---------------------------------------------------------------------------
features:
  - {id: F01, text: "Camera-tracked objects and body parts move plugin parameters live", nodes: [src.camera, sig.*, route.matrix]}
  - {id: F02, text: "Each finger open/closed sets a parameter, e.g. pad amount", nodes: [feat.hand.finger, tgt.macro]}
  - {id: F03, text: "Fist open/close sets delay or reverb level", nodes: [feat.hand.openness, tgt.macro]}
  - {id: F04, text: "Snapshot from camera, contours become a MIDI melody", nodes: [snap.capture, snap.contour, midi.contour_melody]}
  - {id: F05, text: "Contour from edge or depth map with adjustable threshold, shown live in the view", nodes: [snap.contour, ui.canvas]}
  - {id: F06, text: "Recognize arbitrary objects; their movement, size and placement drive parameters", nodes: [perc.seg, feat.object]}
  - {id: F07, text: "Generic base mechanism: detection -> feature -> value 0..1 in any direction -> parameter", nodes: [sig.contract, cond.chain, route.matrix]}
  - {id: F08, text: "Multiple objects at once", nodes: [perc.seg, perc.track]}
  - {id: F09, text: "Face split into left eye, right eye and mouth", nodes: [perc.vision.face, perc.seg, feat.face]}
  - {id: F10, text: "Head as parent class, head rotation yaw/pitch/roll", nodes: [feat.head, src.headphones]}
  - {id: F11, text: "Understand how the DAW identifies plugin parameters; synthexis is only a bridge", nodes: [bridge.macros, bridge.fl_script, bridge.harvest]}
  - {id: F12, text: "Headphone gyroscope and heart rate as an extra control layer", nodes: [src.headphones, src.heartrate]}
  - {id: F13, text: "Powerbeats Pro 2 head tilt replaces camera head pose when present", nodes: [src.headphones, fuse.head]}
  - {id: F14, text: "Occluded feature (mouth while head turned) holds its value instead of resetting", nodes: [cond.occlusion]}
  - {id: F15, text: "Smooth re-acquisition when the new value is far from the held one", nodes: [cond.reacquire]}
  - {id: F16, text: "First-principles architecture so later additions do not get blocked", nodes: [sig.contract, decisions]}
  - {id: F17, text: "Editable visual map (FigJam) the agent reads back to correct the plan", nodes: [process.figjam_roundtrip]}
  - {id: F18, text: "Hand shape live: fingers are chord notes, spreading fingers enlarges chord or arp", nodes: [midi.chord, feat.hand.spread]}
  - {id: F19, text: "Cut-out snapshots of hands/face stay on the canvas as fixed elements next to the live ones", nodes: [snap.anchor]}
  - {id: F20, text: "Plugin UI: camera canvas on top, parameter menu below", nodes: [ui.canvas, ui.panel]}
  - {id: F21, text: "Click a cut-out to see its own parameters (on/off, mix 0..100 %), automatable in FL", nodes: [snap.anchor, tgt.anchor_params]}
  - {id: F22, text: "Live mode is recordable; parameter moves become DAW automation", nodes: [bridge.macros, rec.automation]}
  - {id: F23, text: "Separate in-house parameters from mirrored parameters of other plugins", nodes: [tgt.macro, tgt.anchor_params, bridge.fl_script]}
  - {id: F24, text: "Works with every existing plugin, no own synth", nodes: [bridge.macros, bridge.midi_out, bridge.fl_script]}
  - {id: F25, text: "Pads, plucks, pianos, basses", nodes: [midi.chord, bridge.macros]}
  - {id: F26, text: "Drums: one hand drives synth parameters, the other hand drives drum patterns", nodes: [midi.patterns, route.matrix]}
  - {id: F27, text: "Hi-hat: thumb up plays a basic pattern while held; index finger plays a trap roll; user picks the note (e.g. C4)", nodes: [gest.finger_states, midi.patterns]}
  - {id: F28, text: "Same for snare and other drum voices", nodes: [midi.patterns]}
  - {id: F29, text: "Own step grid / piano roll (e.g. 8 bars) to draw the pattern a finger plays", nodes: [ui.pattern_editor, midi.patterns]}
  - {id: F30, text: "Scale and key selection, preset chords and accents per finger for melodic plugins", nodes: [midi.scale, midi.chord, midi.patterns]}
  - {id: F31, text: "MIDI section: choose target channel; presets; chord sequences of any length", nodes: [bridge.midi_out, ui.pattern_editor]}
  - {id: F32, text: "Tempo and position come from the DAW transport", nodes: [midi.transport]}
  - {id: F33, text: "Everything live and recorded: MIDI into the DAW, parameters as automation", nodes: [rec.midi, rec.automation]}
  - {id: F34, text: "Demo built for FL Studio first", nodes: [demo]}
  - {id: F35, text: "Real-time perception on the device: own small student model", nodes: [perc.seg, perc.hand, train.*]}
  - {id: F36, text: "Multi-camera, including iPhone, to film other places as extra sources", nodes: [src.camera]}
  - {id: F37, text: "Runs in real time on low-end Apple Silicon", nodes: [budget.latency]}
  - {id: F38, text: "Small model that knows what plugin parameters mean, for mapping", nodes: [bridge.harvest, map.param_sense]}
  - {id: F39, text: "SAM 3.1 as teacher, own student model as the Meta showcase", nodes: [train.teacher, train.students]}
  - {id: F40, text: "Freestyle is read live: the plugin names what the hands are doing (throw, swipe, hold, orb ...) with its parameters, no setup needed (Noa 2026-10-27)", nodes: [motion.primitives, motion.readout]}
  - {id: F41, text: "Preset Pong: throw at any point of the frame border; side and position along it become notes and values, the projectile bounces", nodes: [preset.pong]}
  - {id: F42, text: "Preset Orb: hold an orb between both hands; size, position and rotation are signals; release throws it", nodes: [preset.orb]}
  - {id: F43, text: "Record own motifs (3-5 takes) and have them recognized live", nodes: [motion.motifs]}
  - {id: F44, text: "Muse Spark Open watches the freestyle recordings and labels what happened, for evaluation, motif examples and the demo", nodes: [motion.labels]}

# ---------------------------------------------------------------------------
# 2. Signal contract: the one interface every source and target speaks.
# ---------------------------------------------------------------------------
sig.contract:
  sample: {value: "f32 in 0..1", confidence: "f32 in 0..1", t_capture: "host-monotonic ns of the camera frame or sensor sample", present: bool}
  ids: "<source>.<entity>.<feature>, e.g. cam0.hand.L.finger.index, cam0.mouth.open, hp.head.yaw, hr.bpm, cam1.object.2.angle (cam0. + the ontology source id, the side after its first segment: the face ids are cam0.mouth.open, cam0.face.smile, cam0.eye.L.open / .closed, cam0.eye.R.open / .closed, cam0.head.yaw / .pitch / .roll)"
  rule: "Perception never runs on the audio thread. The audio thread reads the latest conditioned values from a lock-free snapshot once per block."

# ---------------------------------------------------------------------------
# 3. Sources
# ---------------------------------------------------------------------------
sources:
  src.camera:
    what: "Any AVCaptureDevice: built-in FaceTime camera, USB webcam, iPhone via Continuity Camera. One capture session per device, shared by all synthexis instances in the host process."
    multi: "N cameras at once; entity ids carry the camera index (cam0, cam1, ...)."
    note: "iPhone via Continuity delivered 30 fps even with a 60 fps format selected (H1, open)"
    status: building
  src.headphones:
    what: "Powerbeats Pro 2 head attitude (yaw, pitch, roll) and user acceleration via CMHeadphoneMotionManager."
    evidence: "hypothesis: Apple lists head tracking for Powerbeats Pro on Mac; third-party access untested (probe P4)"
    status: probe
  src.heartrate:
    what: "Powerbeats Pro 2 heart rate over the standard BLE Heart Rate Service (0x180D, characteristic 0x2A37)."
    evidence: "doc: DC Rainmaker review (broadcasts as BLE HR profile); Mac read while connected as audio untested (probe P5)"
    status: probe
  src.watch:
    what: "Apple Watch heart rate"
    status: dropped
    reason: "No HealthKit streaming to macOS without an iPhone/watch companion app. Revisit after the hackathon."

# ---------------------------------------------------------------------------
# 4. Perception (local, real time)
# ---------------------------------------------------------------------------
perception:
  # Probe C (M1 Pro, 1280x720): Vision hand 18.4 / 27.8 ms (median / p95), face landmarks 14.5 / 24.6,
  # body 15.4 / 20.4, hand+face+body in one call 29.6 / 46.6 ms. Too slow to run live next to the students.
  perc.vision.hand: {what: "Apple Vision hand pose, 2 hands x 21 keypoints", role: "eval baseline; optional live fallback at reduced rate; never a training teacher (Apple DPLA 3.2, probes/licence-check)", status: planned}
  perc.teacher.hand: {what: "Merged keypoint teacher for synthexis-hand: per SAM 3.1 hand the MediaPipe Hand Landmarker (Apache-2.0) keypoints, else SAM 3D Body's; chirality from SAM 3D Body where it saw the hand", role: "keypoint targets in data/keypoints/<s>/cam0/keypoints_teacher.jsonl (38,004 hands, S4 7,185 held out); only SAM-matched hands", status: done, see: probes/hand-keypoints/RESULT.md}
  perc.teacher.hand_sam3d: {what: "SAM 3D Body (facebook/sam-3d-body-dinov3, SAM License) hand decoder on Modal A10G, prompted with the SAM person box, every second SAM-hand frame", role: "fills SAM hands MediaPipe misses (fists, occlusion, objects); chirality 99.7-100 % vs protocol; fingertips end short of MediaPipe's", status: done, cost: "5.36 $ (Modal billing 2026-11-02)", see: probes/hand-keypoints/RESULT.md}
  perc.vision.face: {what: "Apple Vision face landmarks + yaw/pitch/roll", role: "live face source of backend hybrid (landmarks on the seg student's face box, perception.rs LandmarkWorker) and offline eval baseline; Vision's own yaw/roll come in 45 / 30 degree steps, its yaw and pitch signs were flipped to the ontology 2026-11-04", status: building, see: docs/session-2026-11-04-head.md}
  perc.vision.body: {what: "Apple Vision body pose, 19 joints", role: "eval baseline for a later body head (v2); not a teacher (Apple terms)", status: planned}
  perc.seg:
    what: "synthexis-seg student: semantic masks [background, person, face, eye, mouth, hand, object], CoreML FP16 on the Neural Engine"
    role: "every frame: hand boxes for crops, face parts, body silhouette, arbitrary objects, canvas masks, cut-outs"
    params_budget: "<= 4M"
    candidates: "probe B: MobileNetV4-Conv-Small + LR-ASPP 1.51M params, 0.48 / 0.59 ms at 256 px and 0.66 / 1.62 ms at 320 px (median / p95, ANE); LRASPP-MobileNetV3-Large 3.22M, 0.74 / 1.67 ms at 256 px"
    status: planned
  perc.hand:
    what: "synthexis-hand student: hand crop 128 px -> 21 keypoints (teacher: MediaPipe Hand Landmarker run offline on our recordings, hands matched to SAM, probes/hand-keypoints/RESULT.md; Apple Vision may not teach, Apple terms) + 5 finger-state logits (teacher: recording script)"
    role: "all live finger features: per-finger extension, spread, openness, discrete finger states"
    params_budget: "<= 2.5M"
    candidates: "probe B: MobileNetV3-Small 1.52M params 0.35 / 0.48 ms, MobileNetV4-Conv-Small 2.50M 0.38 / 0.55 ms (median / p95, ANE, 128 px)"
    check: "confirm Apple's developer terms allow Vision outputs on our own recordings as training labels. Result 2026-11-02 (probes/licence-check/RESULT.md): no. DPLA section 3.2 (updated 2026-10-29) and Xcode and Apple SDKs Agreement section 2.2 C forbid using output generated from an Apple model to train another AI model; runtime fallback and eval stay allowed. Alternatives listed there (MediaPipe Hand Landmarker, Apache-2.0, same 21 points); Noa 2026-11-02: switch to the best licence-clean state-of-the-art teacher; now MediaPipe Hand Landmarker (Apache-2.0, probes/hand-keypoints/RESULT.md on branch claude/vision-keypoints-ae6b72); SAM 3D Body (SAM License; DINOv3 License for its backbone code) adds 2,349 of 38,004 teacher hands and chirality; extracted Vision keypoints discarded so nothing trains on them"
    status: planned
  perc.track: {what: "Track ids across frames: IoU + centroid matching on masks and keypoints; left/right hand from image side and wrist-to-body geometry", status: planned}
  fuse.head: {what: "Head pose = headphones when connected and confident, else camera face pose; crossfade on switch", status: planned}

# ---------------------------------------------------------------------------
# 5. Features derived by geometry (deterministic, unit-tested)
# ---------------------------------------------------------------------------
derived_features:
  feat.hand.finger: "per finger: extension from joint angles (tip-pip-mcp), 0 folded .. 1 straight"
  feat.hand.openness: "mean finger extension, or mask solidity (area / convex hull area) from perc.seg"
  feat.hand.spread: "angle between index and pinky rays, normalized"
  feat.hand.position: "palm centre x, y in frame; depth proxy from hand size"
  feat.face: {what: "eye openness L/R (eyelid distance / eye width), mouth openness (inner lip distance / mouth width), smile", status: "building 2026-11-04 (hybrid): mouth.open and both eyes pass their rules on S1 and S3; winks fail in S2 (glasses) and S1 (right eye), a smile opens the mouth signal to p90 0.32 to 0.59 (docs/session-2026-11-04-head.md)"}
  feat.head: {what: "yaw, pitch, roll", status: "building 2026-11-04: weak-perspective pose (POS) from 7 rigid Vision landmarks against the running neutral pose, gated by the fit residual (geom.rs HeadPose); each axis spans 0..1 in its own sweep on S1-S3, a head tilt still moves yaw and pitch (docs/session-2026-11-04-head.md)"}
  feat.face_head.signals:
    note: "2026-11-04, backend hybrid, block C of S1-S3 and S4 held out (probes/head-signals/score.py); parser and completion DE and EN (plugin/parser/tests/head_live.rs, plugin/complete/tests/head_vocab.rs)"
    cam0.mouth.open: {status: building, verdict: "passes on S1-S4 except a smile, which opens it to p90 0.32..0.59"}
    cam0.eye.L.open: {status: building, verdict: "closed 0.00 and blink everywhere; wink_L leaves the left eye at 0.64 in S2 (glasses)"}
    cam0.eye.R.open: {status: building, verdict: "closed 0.00 except S2 (1.00, glasses); wink_R reads 0.48 in S1"}
    cam0.eye.L.closed: {status: building, verdict: "1 - eye.L.open"}
    cam0.eye.R.closed: {status: building, verdict: "1 - eye.R.open"}
    cam0.head.yaw: {status: building, verdict: "sweep 0..1 (S3 0.80), neutral 0.43..0.51; a head tilt moves it by 0.73..0.98 (roll sweep)"}
    cam0.head.pitch: {status: building, verdict: "sweep 0..1, neutral 0.45..0.62; a head tilt moves it by 0.57..0.61"}
    cam0.head.roll: {status: building, verdict: "sweep 0.85..1.00, neutral 0.45..0.52, 0.17..0.51 in the yaw sweep"}
    cam0.face.smile: {status: building, verdict: "not re-measured in this session"}
    parser: {status: building, verdict: "head sentences with the completion's chip 34/34, typed DE 17/17 EN 15/17; completion offers tilt (to a shoulder, roll) and turn (up, down, left, right) in DE and EN; German direction words in the target (senkt, sinkt, nimmt raus) 7/12 right, English 11/12"}
  feat.object: "per tracked object: x, y, area, angle (second moments), velocity"
  feat.body: "arm raise L/R, lean, shoulder width proxy"

# ---------------------------------------------------------------------------
# 6. Conditioning: per route, applied in this order
# ---------------------------------------------------------------------------
cond.chain:
  cond.range: "in_min/in_max -> 0..1, invert, curve (linear, exp, log, s-curve)"
  cond.filter: "One Euro filter (min_cutoff, beta, d_cutoff) against jitter with low lag"
  cond.occlusion: "on present=false or confidence < c_min: hold last value for hold_ms (default 600), then glide to rest value over decay_ms (default 800) or freeze (per route)"
  cond.reacquire: "on return: slew-limit to max_rate units/s (default 2.0) or crossfade over reacquire_ms (default 150) from held to live value"
  cond.hysteresis: {what: "discrete states: on_threshold / off_threshold + min_dwell_ms (default 60)", status: "built 2026-11-04 for MIDI triggers: route.rs Edge (0.55 / 0.45, 60 ms, 600 ms occlusion hold), engine ShapeGate for finger states (0.6 / 0.4, 60 ms)"}
  cond.quantize: "optional steps or scale degrees"

route.matrix: "many-to-many: any signal to any target with depth -1..1; one signal may drive many targets, one target may sum many signals (clamped)"

# ---------------------------------------------------------------------------
# 7. Targets and DAW bridge
# ---------------------------------------------------------------------------
targets:
  tgt.macro: "32 host-automatable synthexis parameters (Signal 1..32). Host records them as automation and links them to any plugin parameter."
  tgt.anchor_params: "8 anchor slots x 4 parameters (enabled, mix 0..100 %, transpose, gate) exposed to the host"
  tgt.midi_cc: "MIDI CC out on a chosen channel"
  tgt.midi_notes: {what: "notes from patterns, chords and contour melodies", status: "built 2026-11-04 for patterns, chords in key and single notes (midi.rs, route Target::Part); contour melodies not built"}
  tgt.fl_param: "direct value of any FL plugin parameter through the FL bridge script"

bridge:
  bridge.macros: {what: "Route A, universal: macros + host linking (FL: Link to controller / Multilink)", status: planned}
  bridge.midi_out: {what: "Route B: plugin MIDI out to other channels (FL: MIDI output port -> channel input port)", status: "not needed: it needs wrapper port settings by hand; notes go through bridge.fl_notes (probes/fl-midi-notes, 2026-11-04)"}
  bridge.fl_notes: {what: "notes to the FL channel a part names, through the bridge script (protocol 5): JSON 'notes' batches, the script plays them with channels.midiNoteOn; no MIDI or wrapper settings", status: "measured 2026-11-04: plays on the named channel while another is selected, 16/16 recorded into its pattern, delivery p95 0.42 ms, 30 notes/s with 0 lost pings and no hanging note (probes/fl-midi-notes/RESULT.md)"}
  bridge.fl_script:
    what: "Route C, FL deep bridge: FL Python MIDI controller script + CoreMIDI virtual ports. Script lists plugins and parameter names (plugins.getParamName), sends them to synthexis via SysEx, sets values on request (plugins.setParamValue)."
    evidence: "P3 passed on the probe VST3. Open bug: on the synthexis skeleton FL never forwards plugins.setParamValue to the plugin (nih-plug wrapper log shows no setParamNormalized, no process change; FL's getParamValue answers from its own mirror). general.processRECEvent(getRecEventId(ch) + REC_Chan_Plugin_First + idx, v * 2^30, REC_MIDIController) works and is the bridge set path. Rejected by test: missing MIDI input, own edits blocking. Untested candidates: SAMPLE_ACCURATE_AUTOMATION (probe true, synthexis false), parameter count or flags, the host_context_available patch (docs/session-2026-10-28-hillclimb.md, Open 1). Not pursued further (roadmap, 2026-11-03): REC events are the set path, the remaining candidates stay untested and the cause unknown."
    mixer_slots: "Third-party plugins in mixer slots are set through general.processRECEvent(mixer.getTrackPluginId(t, s) + REC_Plug_Plugin_First + idx, v * 2^30, REC_MIDIController); getTrackPluginId(t, s) = (t << 22) + (s << 16). Measured (P7): writes reach Portal and ShaperBox 3 on the Master while the song plays, the knobs move in the plugin windows, Portal changes audibly, and FL records the writes as automation (playback range 0.95 and 0.99, 64-66 distinct values). plugins.setParamValue works there too. A read right after a write can return the old value for up to 300 ms."
    inventory: "Measured (P7): all mixer tracks with 10 slots and plugin names in 0.4 ms (18 tracks, 513 bytes); generators in 0.3 ms; parameter names of one plugin in 7-20 ms. Every VST reports 4240 parameters: FL appends 144 MIDI CC entries at index 4096-4239; some plugins name their own CC or reserved slots (Serum 2: 2048 'CC# Chan #', Valhalla: 'ReservedN'). Drop both: Serum 2 has 573 parameters below 4096 without its CC slots, 541 after the plugin's filter. Names are read lazily when a plugin is picked."
    focus: "Measured (P7): with FL in front, OnRefresh with HW_Dirty_FocusedWindow (32) fires on every plugin-window click; mixer.getActiveEffectIndex() gives (track, slot) for an effect, ui.getFocusedFormID() gives the channel for a generator, ui.getFocusedPluginName() the name. Clicking the mixer or channel rack clears the name. With FL in the background all focus reads are empty (formID -1). Mixer track and channel selection raise other OnRefresh flags (263, 65831)."
    limits: "OnSysEx runs on a CoreMIDI thread holding the Python GIL; OnIdle runs on the main thread, at 4.2 Hz with gaps up to 6.9 s while FL is in the background. A SysEx reply of 65,536 bytes deadlocked FL 26.1.7 (modal dialog on the main thread waiting for the GIL); the script refuses replies above 60,000 bytes and pages at 16 KB or less. Nothing that opens FL UI may run inside OnSysEx."
    shipped: "plugin/fl/device_synthexis_bridge.py, protocol 4: the synthexis plugin opens its MIDI ports itself (plugin/synthexis/src/fl.rs), a source and a destination both named 'synthexis' since 2026-11-03 (before: 'synthexis bridge' / 'synthexis bridge return', still used by the probe daemon flbridged); the script sends the inventory, parameter pages and focus events, and writes the parameter values of assigned routes ('rec': REC event for mixer slots, plugins.setParamValue for generators; protocol 4 since 2026-11-03)."
    setup: "No MIDI settings: plugin/install.sh copies the script into FL's Hardware folder; FL sends a Universal Device Inquiry to every MIDI device name it has never seen (about 1 s after the ports appear, also mid-session); the plugin answers 7D 53 58 46 4C 04 00 00 00 (manufacturer 7D non-commercial, version = protocol), which matches the script's supportedHardwareIds, and FL enables the input, links the output by that reply, picks a port (236 up) and loads the script; supportedDevices=synthexis is a second, name-based way. FL stores every name it saw and never asks it again, so the script must be installed and FL restarted before the ports first appear. Measured in probes/fl-midi-autolink (M2: hello 2.2-3.1 s after the inquiry, every ping answered; name-only match needs one name for both ports). Tested in FL with Noa on 2026-11-03: first start link up 7.0 s after the ports opened, FL stored input 'synthexis' with the script, ID, linked output and port 236; second start up in 4.0 s; MIDI settings never opened."
    test_bridge: "probes/fl-camera-plugin/bridge/ (protocol 1) and probes/fl-target-picker/ (protocol 2, inventory, focus, writes, meter): FL script + CoreMIDI daemon flbridged + flb.py; test-only, never shipped"
    status: building
  bridge.harvest: {what: "Parameter dump of installed plugins (names, ranges, units, value strings) via the FL script and via pedalboard on macOS", status: planned}

recording:
  rec.automation: "macro and anchor params changed through the host parameter API (begin/perform/end edit) on the main thread, so FL records automation with the plugin window open or closed (P2). Gate passed in FL with the skeleton: camera-driven Signal 1/2 and a test triangle on Signal 32 recorded and played back (range 0.744, empty pattern flat)"
  rec.midi: {what: "notes synthexis plays are recorded by FL into the target channel's pattern", status: "measured 2026-11-04 for bridge.fl_notes: 16 of 16 per path, arrival positions, no quantizing (probes/fl-midi-notes)"}
  rec.latency_comp: "planned feature: FL compensates audio, not plugin automation (FL manual, audio settings). The plugin records takes with t_capture timestamps and exports them shifted by the measured latency (automation clip or .mid drag-out); live, note triggers can snap to the host grid; motion prediction 50-100 ms ahead is a hypothesis"

# ---------------------------------------------------------------------------
# 8. Gestures and MIDI engine
# ---------------------------------------------------------------------------
gest.finger_states: {what: "per hand a 5-bit mask (thumb..pinky extended) after hysteresis; 32 states per hand; user names states and assigns them", status: "built 2026-11-04: signal cam0.hand.<side>.shape = mask / 31 from the student's finger probabilities (engine/geom.rs ShapeGate); 12 named shapes plus any mask in the finger editor"}
gest.hand_role: "Noa 2026-10-27: each hand (and each tracked object) has a role chosen in the plugin UI: MIDI (finger states -> notes, chords, patterns), Parameter (continuous features -> routes), Motion (primitives and presets below) or Off. Roles can be mixed per feature (e.g. finger state -> chord while openness -> cutoff). The role is a host-visible setting stored with the project."
gest.presets:
  preset.chord_hand: "hand role MIDI: finger states pick chords in the project key and scale (midi.chord), spread drives voicing or arp rate"
  preset.filter_hand: "hand role Parameter: openness (fist -> open) opens filter.cutoff, spread opens filter.resonance, both close when the hand closes; targets resolved by map.param_sense, editable as normal routes"
  preset.pattern_hand: "hand role MIDI: finger states trigger pattern slots (midi.patterns), quantized to the host grid"
  note: "basic presets are core scope; preset.pong and preset.orb are extras for the demo (Noa 2026-10-27)"
midi:
  midi.transport: {what: "tempo, PPQ position and play state from the host every block", status: "built 2026-11-04: process() publishes it lock-free, the player maps the host clock to beats; with the host stopped it runs on its own clock at the last tempo"}
  midi.patterns: {what: "pattern slot = clip (step grid or piano roll, 1..8 bars, note, velocity, channel). Plays while its finger state is active; starts quantized to the next 1/16 or 1/4; stops at state end or at clip end (per slot)", status: "built 2026-11-04 (midi.rs): bar-aligned clips with ratchets and nudge, start now / 1/16 / beat / bar, modes while shown / on-off / once, templates hi-hat basic, trap roll, snare fill, kick, clap"}
  midi.chord: {what: "finger count / spread -> chord size and voicing within key and scale; spread can drive arp rate", status: "partly built 2026-11-04: chords on scale degrees with size, octave, strum and progressions per bar; finger count and spread do not drive them yet"}
  midi.scale: {what: "key + scale (major, minor, dorian, phrygian, harmonic minor, pentatonics, custom)", status: "built 2026-11-04 without custom scales"}
  midi.contour_melody: "contour polyline resampled over N steps; y -> scale degree, x -> time; result is a pattern clip"

# ---------------------------------------------------------------------------
# 8b. Motion layer: primitives, presets, motifs (Noa 2026-10-27, from the S1 freestyle)
# ---------------------------------------------------------------------------
motion:
  motion.primitives:
    what: "live, offline, at camera rate, from feat.hand.* tracks (normalized frame coordinates), finger states and two-hand geometry. Each primitive emits an event plus continuous parameters on the signal contract (value 0..1, confidence, timestamp)."
    vocabulary:
      throw: "hand speed peak above v_min (frame widths per s), then release (openness rises) or stop; params: direction angle, speed, release point; the ray from the release point hits the frame border at a perimeter position"
      swipe: "sustained motion without release; params: direction (8 sectors and angle), speed, distance"
      push_pull: "rate of change of the depth proxy (hand size)"
      hold: "speed below v_hold for >= 300 ms; params: position, finger state"
      pinch: "thumb-index tip distance below threshold with hysteresis; params: drag x, y"
      circle: "accumulated angle of the hand path around its running centroid; params: rate, direction cw/ccw, radius"
      grab_release: "openness crosses the hysteresis band down (grab) or up (release)"
      two_hand: "stretch (palm distance rate), orb (palms facing each other: size = palm distance, centre x, y, rotation of the palm-palm line), clap (distance to near zero at speed)"
    approach: "v1 is geometry on student keypoints (deterministic, unit-tested, no training data needed); a learned primitive classifier only if motion.eval misses its target"
    status: planned
  motion.readout: "the canvas labels the current primitive next to the hand ('throw -> right edge 0.62'), so any spontaneous movement is visible and mappable; the mapping assistant can address primitives ('when I throw, ...')"
  preset.pong:
    what: "frame border as one ring: a throw ray hits side (top, right, bottom, left) and perimeter position 0..1. A visual projectile flies and bounces like Pong; every wall hit is an event with speed."
    border_zones: "the ring is split into user-sized segments; each segment is assigned to a target: a parameter, a MIDI note or a pattern slot"
    hit_ramp: "a hit on a parameter segment fires a one-shot ramp through that parameter: shapes up, down, triangle, exponential decay, ADSR, bounce, steps; depth from throw speed, length synced to the host tempo or free in ms. Several ramps may overlap and sum (clamped)."
    hit_note: "a hit on a note segment plays a note: position quantized to the scale, velocity from speed"
    options: "grid quantization of hits, max bounces, projectile speed and gravity"
    scope: "border zones and hit ramps live only inside this preset for now (Noa 2026-10-27)"
    changed: "Noa 2026-11-04 night: the shot is pointing (index shown, middle, ring and pinky folded; flick as an option), not a throw; four sides, each one action (a MIDI part once per hit, or a parameter or Signal macro: ramp up and glide back, position, toggle), not user-sized segments; overlapping ramps on a side take the maximum, not the sum; no gravity, no position-to-pitch yet"
    status: "built 2026-11-04 night (plugin/synthexis/src/pong/, pong_ui.rs, docs/session-2026-11-04-pong.md); shot measured on S2 to S4 (probes/pong-shot/RESULT.md); FL test with Noa open"
  preset.library: {what: "named presets apart from the project: snapshot of sentence routes, MIDI parts and binds, Pong setup and picked plugin; save, load with undo, delete; built-ins listed first and protected", status: "built 2026-11-04 night (plugin/synthexis/src/preset.rs, files in ~/Library/Application Support/synthexis/presets/); built-in Pong stress test"}
  preset.orb:
    what: "two_hand.orb drawn between the palms; size, x, y, rotation -> 4 signals"
    throw: "fast separation releases the orb as a projectile into preset.pong; it bounces and hits border zones"
    explode: "closing both hands fast on the orb (or an orb hitting another orb) bursts it: a fan of projectiles at once, each hitting the border and firing its ramp or note"
    status: "extra for the demo"
  motion.motifs: "user records a movement 3-5 times; the plugin stores the feature trajectories (palm positions and velocities, finger states, two-hand distance), recognizes live by DTW against the takes with a rejection threshold; emits event + progress 0..1. Offline, no training."
  motion.novelty: "stretch: a primitive sequence that recurs >= 3 times in a session and matches no motif -> canvas suggests saving it as a motif (hypothesis, after v1)"
  motion.labels: "build time: Muse Spark Open on Baseten (image input verified 2026-10-27) reads frame strips (2 fps, SAM masks overlaid) of every freestyle segment and writes a timeline in the motion.primitives vocabulary plus a free-text name per event. Same pass checks 3 frames per scripted segment against its instruction; mismatches are flagged for Noa (catches errors not marked with B). Noa consented 2026-10-27 to sending his frames to Baseten. Spark Open labels do not train SAM (frozen teacher); they evaluate the motion layer, seed motif examples and filter finger-state labels."
  motion.eval: "primitive events vs Spark Open timeline on S4 freestyle, spot-checked by Noa: event F1 >= 0.85, movement end to event <= 100 ms (targets, hypothesis)"

# ---------------------------------------------------------------------------
# 9. Snapshot and anchors
# ---------------------------------------------------------------------------
snapshot:
  snap.capture: "freeze a frame from any camera"
  snap.segment: "SAM 3.1 API image call with the selected concept or a click point ($0.0025 per image); offline fallback: synthexis-seg mask"
  snap.contour: "edge/mask contour with adjustable threshold and simplification, previewed on the canvas"
  snap.anchor: "cut-out sprite pinned on the canvas. Kinds: frozen controller (holds the gesture's signal values; mix blends frozen and live), zone (live hand overlapping it triggers or modulates), melody source (contour -> clip)"

# ---------------------------------------------------------------------------
# 10. Mapping assistant
# ---------------------------------------------------------------------------
map:
  map.taxonomy: "about 40 parameter meanings: filter.cutoff, filter.resonance, amp.gain, fx.reverb.mix, fx.delay.mix, fx.delay.time, env.attack, env.release, osc.pitch, unison.detune, lfo.rate, macro, other, unsafe(master volume, output gain)"
  map.labeler: "Muse Spark Open (Baseten, meta-models/muse-spark-open-1026) labels harvested parameters with taxonomy + safe range"
  map.license: "Muse Model License allows distillation; any model trained on Spark Open outputs is a Derivative and the product must show 'Built with Muse Spark Open' in its UI or docs"
  map.param_sense: "student 1, classifier: parameter name + plugin name + unit + value strings -> taxonomy class. Char n-gram hashing + linear/MLP, <= 1M params, < 5 MB RAM, in Rust, offline for unseen plugins"
  map.parser: "student 2, structured tagger (not a generative LM): sentence -> intent + slots (source gesture/feature, target meaning, target track or plugin, modifiers: invert, range, curve, amount). Tiny transformer or char-CNN encoder, target <= 5M params, <= 10 MB RAM, <= 5 ms. Trained on synthetic German and English commands that Spark Open writes from known structured edits, so labels are known by construction"
  map.resolver: "deterministic: binds slots to real parameters through param-sense labels and fuzzy channel/plugin names"
  map.fallback: "Noa 2026-10-26: never ask Spark Open online at runtime. When a sentence is unclear, the plugin shows the sentence with every recognized term as a clickable chip (gesture, meaning, track, plugin). Clicking a term lists matching options (e.g. 'Reverb' -> all reverb-mix parameters in the project, 'Faust' -> hand openness / finger states); the user picks and links by hand. Fully offline."
  map.eval: "100 commands written by Noa by hand, never trained on: exact route-edit accuracy >= 0.90; param-sense top-1 on plugins from unseen vendors >= 0.90"
  map.research: "grounding so far: Oliveira 2026 (arXiv 2604.24636): on-device language features are reliable when the model does the least; Rana et al. COLING 2025 industry: slot filling distilled from LLM teachers with LLM-generated data; Gody et al. 2025: LLM annotations distilled into BERT-size intent classifiers"
  map.agent: "offline at runtime: typed sentence -> map.parser -> map.resolver -> route changes ('fist controls reverb and delay on the pad, mouth opens the bass filter'). One sentence may create several routes. The result is shown as a diff in the route matrix; the user accepts, edits or undoes it. Everything stays editable by hand. Muse Spark Open works only at build time (parameter labels, synthetic commands)."
  map.bonus_prize: "Noa 2026-10-27: no online button, not even opt-in. Best Build on Meta Open Weight Models rests on the build-time pipeline: Muse Spark Open on Baseten labels the harvested parameters and writes the synthetic commands that train param-sense and map.parser. Demo and README must show that pipeline with real request counts and the 'Built with Muse Spark Open' credit. Whether judges accept build-time use as 'runs on' is unverified."
  map.voice: "optional, online: push-to-talk through Muse Voice Transcribe realtime ($0.18 per hour of audio) feeding map.parser; ask Noa (same online question)"

# ---------------------------------------------------------------------------
# 11. Data engine and student training
# ---------------------------------------------------------------------------
train:
  train.protocol: "scripted recording sessions: each segment is one known finger state / face action / object, so gesture labels come from the script. Built-in camera + iPhone, two lighting setups, held-out session on another day."
  train.synthetic: "Muse Image ($0.01 per image) renders varied people, hands, gestures, rooms and light; gesture label from the prompt; Muse Spark Open checks it"
  train.teacher: "SAM 3.1 open weights on Modal, image mode 'grouped' since 2026-10-29 (backbone once per frame, all prompts in one grounding call; a third to a sixth of video-mode cost, agrees on person/face/hand and finds more blurred hands; probes/label-image-mode/RESULT.md). Concepts: person, face, eye, mouth, hand, block-E objects. Meta API used for snapshots and a cross-check sample."
  train.labels_status: "S1 labelled (video mode, objects redone in image mode), S2 labelled 2026-10-29 in image mode (13,558 frames, $2.76). Open: S2 eye masks are about 2.2x larger relative to the face than S1 (glasses, lens painted as eye); proposal: ignore the eye class in the loss for S2 frames, decide before the first training run. S3 and S4 without glasses."
  train.students: "synthexis-seg and synthexis-hand trained on Modal GPUs, exported to CoreML FP16"
  train.setup:
    data: "packed on the Mac before upload: frames downscaled to training size (seg 384x216), hand and face crops of 128 px cut from the full-resolution frames using SAM boxes (D10), labels alongside, written as tar shards of about 2,000 samples. Modal Volumes work best below 50,000 files (doc: modal.com/docs/guide/volumes); S1-S3 as loose JPEGs and PNGs would exceed that. The container copies its shards to local disk at start."
    split: "dev = whole segments held back per session (never random frames: neighbouring frames are near duplicates); S4 only for the final gate"
    model: "ImageNet-pretrained backbones (license checked per weight file), bf16 mixed precision, AdamW + cosine; seg head LR-ASPP, hand head keypoints + 5 finger-state logits"
    gpu: "L4 by default; the pilot measures samples/s and $ per epoch, a bigger GPU only if the data loader keeps it busy"
    preflight: "free local run before every paid run: 64 samples, 20 steps on the Mac, checks shapes, label ranges, falling loss and CoreML export"
    guards: "same as labelling: pilot epoch with re-estimate and abort above the cap, runtime spend guard, checkpoint per epoch to the volume, resumable, function timeout"
    runs: "one line per run in docs/hillclimb.tsv, one change per run; seed spread decides: accept a change only above max(1 point, 2 standard errors) over 3 seeds, and test data effects against a control with the same step count"
    eval: "per-class IoU against the teacher and per-class recall plus confusion matrix for finger states; students trained on teacher labels can inherit a teacher's class skew, so thresholds are calibrated on dev"
    lessons: "from kleinhirn K24 (FINDINGS §20, §22, §24, §28): fixed container start cost matters (Qwen job: 0.12 $ per start, 229 s to model ready), so batch work per container; more steps alone can fake a data effect, so run matched controls; a distilled student skewed toward one class was fixed by calibration, not retraining"
  train.eval: "held-out session only. Gate before shipping a student (see budget.quality)"

budget:
  budget.latency:
    seg_p95_ms: 3        # M1 Pro Neural Engine; probe B random-init candidates: 0.59 ms (256 px), 1.62 ms (320 px)
    hand_p95_ms: 1.5     # per crop; probe B candidates: 0.48-0.55 ms
    perception_frame_p95_ms: 5   # seg + 2 hand crops + geometry; Apple Vision alone needs 46.6 ms p95 (probe C)
    note: "headroom allows a larger seg input or backbone if quality needs it; re-measure with trained weights"
    camera_to_param_fl_ms: "116-126 median, 142-145 p95 (built-in camera, plugin skeleton in FL; camera delivery PTS to callback 117-135 ms median, features 0.7 ms median; probes/fl-camera-plugin/RESULT.md, Welle-3-Gate)"
    light_to_callback_ms: "built-in 154 / 178, iPhone Continuity 100 / 116 (median / p95; probes/camera-latency/RESULT.md); built-in floor about 80-90 ms (derived from the fast delivery state, hypothesis)"
  budget.quality:
    seg_miou_vs_teacher: {person: 0.85, face: 0.85, hand: 0.85, eye: 0.70, mouth: 0.70}
    finger_state_accuracy: 0.95
    signal_mae: {mouth_open: 0.05, hand_openness: 0.05}
  budget.money:
    modal_usd: "credits: 25 until 2026-10-31 (expires), 30 from 2026-11-01; plus up to 12.50 paid overage that Noa allows (real money, use only when needed). Spent by 2026-10-27: about 18.2 (S1 labels 17.51, computed from container seconds, 2x over estimate because post-processing ran on the H100). Modal billing report 2026-10-29 (workspace billing API, gross): October total 24.996 (Oct 1-2: 4.15, Oct 19: 0.11, Oct 26: 0.48, Oct 27: 19.39, Oct 28: 0.88), so the October credit is used up and every run before 2026-11-01 comes out of the 12.50 overage. Noa 2026-10-29: label S2 today; caps pilot 0.75, S1 mug/pen redo 0.30, S2 6.50; students train only after S4 is labelled. Spent 2026-10-29 (method GPU seconds): pilot 0.17, S1 redo about 0.07, S2 2.76, S2 reverse check 0.26. Students train on Modal too (Noa 2026-10-27), as efficiently as possible. Every paid run: pilot chunk, runtime spend guard, per-run cap. November (30 credit from 2026-11-01), Modal billing report 2026-11-02 06:40 CET: synthexis-parser 9.48, synthexis-sam-label 2.29 (S3, S4), synthexis-sam3d-body 0.005 (two failed pilots: import bug, then HF 403), total 11.78. Update 2026-11-02 15:05 CET: parser 12.06, sam-label 2.29, sam3d-body 5.36 (hand keypoints, stride 2), total 19.71, so 10.29 left for student training. Billing report 2026-11-02 19:40 CET: November 27.50 of the 30 credit; Noa raised the limit to 42.50 (2026-11-02). Student training (app synthexis-students) 13.92 over two rounds; November 41.42 of 42.50 on 2026-11-03 00:45 CET, probes/train-students/RESULT.md."
    meta_api_usd: 150
    baseten_usd: "100 granted 2026-10-27; Muse Spark Open Model API ($1.25 per 1M input, $4.25 per 1M output tokens, litellm/openrouter listing 2026-10)"
    fireworks_usd: "25 if granted"

# ---------------------------------------------------------------------------
# 12. Plugin and UI
# ---------------------------------------------------------------------------
plugin:
  framework: "nih-plug (Rust): CLAP + VST3; AUv2 via clap-wrapper (stretch, also for Logic). FL records automation only from the VST3 with the window closed (P2)."
  skeleton: "plugin/ (Welle 3, gate passed 2026-10-28): camera engine, signal contract, conditioning chain, 32 macros, hand-role params, main-thread writes, latency log, minimal editor; vendored nih-plug de42101 with a host_context_available hook so it writes without the window ever opening (plugin/vendor/PATCHES.md). CLAP and AU without-window writes unchecked."
  gui: "egui via nih_plug_egui; design language: design-glass skill"
  ui.canvas: "camera view with masks, keypoints, live values, anchors; multi-camera picture-in-picture"
  ui.panel: "below the canvas: routes, conditioners, targets, selected element parameters"
  ui.pattern_editor: {what: "step grid / piano roll per pattern slot", status: "built 2026-11-04 (fingers.rs, Noa's pick A+B of docs/design/midi-editor-sketches.html): dither hands to pick a finger or shape, single and total view, drum lanes or scale piano roll, templates, Fill (Euclid), chords as notes"}
  ui.target_picker:
    what: "Names the plugin that new moves, presets and sentences are about. Default 'Follow FL': the last plugin window focused in FL (bridge.fl_script focus), never synthexis' own window; focus on a non-plugin window keeps the last plugin. Manual pick or 'Pin' freezes the target, 'Follow FL' or 'Unpin' releases it. The list shows only the open project by mixer track, never synthexis itself: a track with one plugin is one row, a track with two or more folds into a group with Sound (generators routed to the track) above FX (its effect slots). Effects are named by track and slot ('Portal, Master slot 1'), generators by channel ('Serum 2, Channel 1'); a binding stores (track, slot or channel, plugin name) and is dropped when that slot holds another plugin. The picked plugin scopes the resolver of the mapping assistant, the parameter list of new rows and the target of presets; existing rows keep their targets. Planned (docs/ux-plugin.md): 'Whole project' entry, search field, breadcrumb in the top bar."
    evidence: "measured: resolver top-1 0.676 against the picked plugin, 0.580 against 6 plugins, 0.538 against 30 (probes/open-vocab-mapping/picker.py); FL reports focus, track and slot at once with FL in front (P7). Built and tested in FL with Noa on 2026-11-03: plugin/synthexis/src/fl.rs, sentence.rs, sense.rs; parameter names load on pick in 1-14 ms, classes from labels, else param-sense"
    status: building

# ---------------------------------------------------------------------------
# 13. Decisions (Noa can override any of these in FigJam)
# ---------------------------------------------------------------------------
decisions:
  D1: {topic: process model, chosen: "perception in-process on its own threads, one engine per host process shared by all instances; host parameter edits are dispatched to the main thread (P2: FL records only those with the window closed)", alt: "separate helper app over shared memory (crash isolation)", status: proposed}
  D2: {topic: plugin format, chosen: "nih-plug VST3 + CLAP now, AUv2 via clap-wrapper later", status: proposed}
  D3: {topic: keypoints, chosen: "students only at runtime: synthexis-seg + synthexis-hand (about 1.2 ms per frame on the ANE); MediaPipe Hand Landmarker runs offline as keypoint teacher (perc.teacher.hand), Apple Vision only as eval baseline because Apple's terms forbid training on its output", why: "probe C: Vision hand+face+body 29.6 ms median, 46.6 ms p95 per frame vs probe B students under 1 ms each", alt: "Vision live as fallback at 10-15 fps", status: proposed, changed: "2026-10-26 after probes B and C (was: Vision live in v1)"}
  D4: {topic: SAM 3.1 path, chosen: "open weights on Modal for bulk labels (SAM License allows derivatives and commercial use); Meta API for snapshots and a cross-check sample", why: "probe A real weights: H100 video mode about 75 ms/frame per concept = $0.082 per 1000 frames vs API $0.20", status: proposed}
  D5: {topic: gesture labels, chosen: "labels from the recording script; Muse Spark Open only checks synthetic data", status: proposed}
  D6: {topic: parameter bridge, chosen: "macros + MIDI out everywhere; FL Python script for discovery and direct control", status: proposed}
  D7: {topic: repo license, chosen: "MIT for all source in this repo", note: "VST3 binaries built with nih-plug's VST3 wrapper link GPLv3 bindings, so those release binaries are GPLv3 combined works; CLAP builds and a later clap-wrapper VST3/AU (MIT VST3 SDK) stay MIT. Noa holds the copyright and can relicense.", status: decided, decided: 2026-10-26}
  D9: {topic: proxy teacher, chosen: "two-step teacher labelling: SAM 3.1 masks train a mid-size proxy (about 20-30M params, higher input resolution); the proxy labels every recorded frame at 30 fps with soft per-pixel probabilities, and those train the tiny students together with the SAM masks", why: "EUPE (Meta, arXiv 2603.22387, ablation Table 2): direct distillation from huge teachers into small students loses signal, an intermediate proxy recovers it; the proxy also labels frames SAM never saw at no Modal SAM cost", status: proposed}
  D10: {topic: resolution and crops, chosen: "full frame at low resolution (384x216) for person, hand, object; face crop (about 128 px, from the full-res frame) for eye and mouth, the same way hands use 128 px crops", why: "at 384x216 an eye is about 10 px wide, too small for a reliable mask; crops keep compute low and detail high (MediaPipe-style detector + ROI)", status: proposed}
  D11: {topic: temporal prior, chosen: "the seg student gets the previous frame's mask as an extra input channel (or a small recurrent state) and a temporal-consistency loss between neighbouring frames", why: "MobileSAM2 (arXiv 2607.12297) distils SAM2's temporal knowledge explicitly; recurrent matting nets reach stable masks at small size. Reimplemented, no code copied.", status: proposed}
  D12: {topic: backbone family, chosen: "CNNs that map well to the Neural Engine: MobileNetV4-Conv-Small (measured, probe B) first, RepViT-M0.9 as challenger; EfficientViT-B0 dropped: it fails to convert to CoreML (attention context module; probes/coreml-student-latency/RESULT.md, D10-D12 export check). MobileNetV4-Conv-Small, its 0.5 variant and RepViT-M0.9 convert at 384x216 and 320x180 with and without a previous-mask channel; latency and quality pick after the first trained student", why: "EfficientSAM3 (arXiv 2511.15833) distils SAM3 into RepViT, TinyViT and EfficientViT students from 0.7M to 21M params; YOLO26-seg excluded (AGPL-3.0)", status: proposed}
  D8: {topic: design language, chosen: "design-glass tokens and the chiasma UI lessons (chiasma/docs/STYLE.md), implemented fresh in egui via the design-rust skill; no chiasma code copied (hackathon new-work rule)", status: decided, decided: 2026-10-26}

