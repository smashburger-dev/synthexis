[package]
name = "synthexis-complete"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Completion index for the synthexis sentence field: parameters of the picked plugin and gestures"

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# the v11 harness (examples/sim_v11.rs) pins on parser frames
synthexis-parser = { path = "../parser" }
