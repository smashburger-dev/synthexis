[package]
name = "synthexis-parser"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Offline frame parser of the synthexis mapping assistant (ModernBERT encoder + frame decoder)"

[lints]
workspace = true

[dependencies]
anyhow = "1"
candle-core = "0.11.1"
candle-nn = "0.11.1"
rayon = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
bytemuck = "1"
half = { version = "2", features = ["bytemuck"] }

# Apple's sgemm (AMX) for the f32 matrix products; see docs/parser-runtime-plan.md
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11.1", features = ["accelerate"] }
candle-nn = { version = "0.11.1", features = ["accelerate"] }
